# CI for this repository (the platform itself): every static check from `make test`.
# The e2e journeys (`make demo`) need a container runtime with ~8 GiB and run locally.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt
      - run: make test-python

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./local/install-tools.sh
      - run: make test-chart

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.6
      - run: make test-terraform

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./local/install-tools.sh
      - run: make test-workflows

  presets:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, go, java]
    services:
      localstack:
        image: localstack/localstack:4.14.0
        ports: ["4566:4566"]
        env:
          SERVICES: sqs,dynamodb,sns,s3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: "1.25"
      - uses: actions/setup-java@v6
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "21"
      - name: Scaffold and test the ${{ matrix.language }} preset
        env:
          LANG_NAME: ${{ matrix.language }}
          LOCALSTACK_ENDPOINT: http://localhost:4566
        run: |
          python scaffold/new_service.py --name "ci-$LANG_NAME" --team platform --language "$LANG_NAME" --dest "$RUNNER_TEMP/svc"
          cd "$RUNNER_TEMP/svc"
          case "$LANG_NAME" in
            python) pip install -q -r requirements-dev.txt && ruff check . && pytest -q && pytest -q -m integration ;;
            go) test -z "$(gofmt -l .)" && go vet ./... && go test -race ./... && go test -tags integration ./... ;;
            java) ./mvnw -B -q test && ./mvnw -B -q verify -DskipUnitTests ;;
          esac
