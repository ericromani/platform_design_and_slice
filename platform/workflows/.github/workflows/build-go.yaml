# Central build for Go services (preset: templates/go-http).
# Called from a service repo:
#   jobs:
#     build:
#       uses: example-org/platform-workflows/.github/workflows/build-go.yaml@v1
#       permissions: {contents: read, id-token: write}
#
# vet + unit -> integration (build tag `integration`, LocalStack service container)
# -> deploy-values contract -> container image (pushed only on main).
name: build-go

on:
  workflow_call:
    inputs:
      go-version-file:
        type: string
        default: go.mod
      chart-version:
        description: microservice chart version this service deploys with
        type: string
        default: "0.1.0"
      push-image:
        description: push the image (defaults to true on the default branch)
        type: boolean
        default: false
    outputs:
      image-tag:
        description: immutable image tag (git SHA) to deploy
        value: ${{ jobs.image.outputs.tag }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
      - name: Unit tests
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.14.0
        ports: ["4566:4566"]
        env:
          SERVICES: sqs,dynamodb,sns,s3
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: Integration tests
        env:
          LOCALSTACK_ENDPOINT: http://localhost:4566
        run: go test -race -tags integration ./...

  deploy-contract:
    uses: example-org/platform-workflows/.github/workflows/validate-deploy.yaml@v1
    with:
      chart-version: ${{ inputs.chart-version }}

  image:
    needs: [unit, integration, deploy-contract]
    uses: example-org/platform-workflows/.github/workflows/build-image.yaml@v1
    permissions:
      contents: read
      id-token: write
    with:
      push: ${{ inputs.push-image || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
