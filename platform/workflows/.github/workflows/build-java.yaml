# Central build for Java services (preset: templates/java-springboot).
# Called from a service repo:
#   jobs:
#     build:
#       uses: example-org/platform-workflows/.github/workflows/build-java.yaml@v1
#       permissions: {contents: read, id-token: write}
#
# unit (surefire) -> integration (failsafe *IT, LocalStack service container)
# -> deploy-values contract -> container image (pushed only on main).
name: build-java

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"
      chart-version:
        description: microservice chart version this service deploys with
        type: string
        default: "0.1.0"
      push-image:
        description: push the image (defaults to true on the default branch)
        type: boolean
        default: false
    outputs:
      image-tag:
        description: immutable image tag (git SHA) to deploy
        value: ${{ jobs.image.outputs.tag }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Unit tests
        run: ./mvnw -B test

  integration:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.14.0
        ports: ["4566:4566"]
        env:
          SERVICES: sqs,dynamodb,sns,s3
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Integration tests
        env:
          LOCALSTACK_ENDPOINT: http://localhost:4566
        run: ./mvnw -B verify -DskipUnitTests

  deploy-contract:
    uses: example-org/platform-workflows/.github/workflows/validate-deploy.yaml@v1
    with:
      chart-version: ${{ inputs.chart-version }}

  image:
    needs: [unit, integration, deploy-contract]
    uses: example-org/platform-workflows/.github/workflows/build-image.yaml@v1
    permissions:
      contents: read
      id-token: write
    with:
      push: ${{ inputs.push-image || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
