apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ms.name" . }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
  {{- if include "ms.hasAws" . }}
  annotations:
    # IRSA: on EKS the pod-identity webhook injects credentials for this role.
    # In local mode the chart injects the same env/token itself (see deployment.yaml).
    eks.amazonaws.com/role-arn: {{ include "ms.roleArn" . }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
  {{- end }}
automountServiceAccountToken: false
