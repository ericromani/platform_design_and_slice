apiVersion: v1
kind: Service
metadata:
  name: {{ include "ms.name" . }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ms.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.expose.service.port }}
      targetPort: http
